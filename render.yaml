services:
  - type: web
    name: nimbus-auth
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_FILE
        value: /var/data/db.json
    disk:
      name: nimbus-data
      mountPath: /var/data
      sizeGB: 1
